<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行业监控系统 | 娱乐资本论</title>
<style>
/* === RESET === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
ul,ol{list-style:none}
button,input,select,textarea{font-family:inherit}

/* === DESIGN TOKENS === */
:root{
  --accent:#347df8;--accent-hover:#2768d9;--accent-light:rgba(52,125,248,.10);
  --bg:#F7FAFC;--bg-card:#FFF;--bg-secondary:#EDF2F7;--bg-hover:#E2E8F0;
  --text:#1A202C;--text-secondary:#718096;--text-muted:#A0AEC0;
  --border:#E2E8F0;--border-medium:#CBD5E0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:12px;--radius-sm:8px;--radius-xs:4px;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;
  --font:"Noto Sans SC","Source Han Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --font-xs:12px;--font-sm:14px;--font-base:16px;--font-lg:20px;--font-xl:24px;--font-2xl:32px;
  --transition-fast:.15s ease;--transition-normal:.25s ease;
  --max-width:1200px;--header-height:56px;
  --color-success:#48BB78;--color-warning:#ECC94B;--color-error:#F56565;--color-info:#4299E1;
}
[data-theme="dark"]{
  --bg:#0D1117;--bg-card:#161b22;--bg-secondary:#21262d;--bg-hover:#30363d;
  --text:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;
  --border:#30363d;--border-medium:#444c56;
  --accent-light:rgba(52,125,248,.15);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.5);
}

/* === SUBSYSTEM THEMES === */
[data-sys="chaowan"]{--accent:#E91E8C;--accent-hover:#C41878;--accent-light:rgba(233,30,140,.10)}
[data-theme="dark"][data-sys="chaowan"]{--accent-light:rgba(233,30,140,.15)}
[data-sys="guangdian"]{--accent:#1565C0;--accent-hover:#0D47A1;--accent-light:rgba(21,101,192,.10)}
[data-theme="dark"][data-sys="guangdian"]{--accent-light:rgba(21,101,192,.15)}
[data-sys="piaofang"]{--accent:#D97706;--accent-hover:#B45309;--accent-light:rgba(217,119,6,.10)}
[data-theme="dark"][data-sys="piaofang"]{--accent-light:rgba(217,119,6,.15)}
[data-sys="duanju"]{--accent:#7C3AED;--accent-hover:#6D28D9;--accent-light:rgba(124,58,237,.10)}
[data-theme="dark"][data-sys="duanju"]{--accent-light:rgba(124,58,237,.15)}
[data-sys="shangshi"]{--accent:#0D9488;--accent-hover:#0F766E;--accent-light:rgba(13,148,136,.10)}
[data-theme="dark"][data-sys="shangshi"]{--accent-light:rgba(13,148,136,.15)}

/* === BASE === */
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;font-size:var(--font-base);min-height:100vh}
a{color:var(--accent);text-decoration:none;transition:color var(--transition-fast)}
a:hover{color:var(--accent-hover)}
button{cursor:pointer}

/* === HEADER === */
.app-header{position:sticky;top:0;z-index:100;background:var(--bg-card);border-bottom:1px solid var(--border);height:var(--header-height);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-lg);backdrop-filter:blur(12px)}
.header-left{display:flex;align-items:center;gap:12px}
.header-brand{font-size:18px;font-weight:900;color:var(--text);cursor:pointer}
.header-sub{font-size:var(--font-xs);color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:8px}

/* === BUTTONS === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;font-size:var(--font-sm);font-weight:600;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;transition:all var(--transition-fast);line-height:1.5;white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-secondary{background:var(--bg-secondary);color:var(--text);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--bg-hover)}
.btn-outline{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn-outline:hover:not(:disabled){background:var(--accent-light)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:none}
.btn-ghost:hover:not(:disabled){background:var(--bg-secondary);color:var(--text)}
.btn-sm{padding:4px 12px;font-size:var(--font-xs);border-radius:var(--radius-xs)}
.btn-danger{background:var(--color-error);color:#fff;border-color:var(--color-error)}

/* === ICON BUTTON === */
.icon-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all var(--transition-fast)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:18px;height:18px}

/* === INPUTS === */
.input-field{padding:8px 12px;font-size:var(--font-sm);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text);outline:none;transition:border-color var(--transition-fast);line-height:1.5;width:100%}
.input-field::placeholder{color:var(--text-muted)}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}

/* === TOGGLE === */
.toggle-wrap{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--font-sm);color:var(--text);user-select:none}
.toggle-track{position:relative;width:44px;height:24px;flex-shrink:0;background:var(--border-medium);border-radius:12px;transition:background var(--transition-fast)}
.toggle-wrap input{position:absolute;opacity:0;width:0;height:0}
.toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform var(--transition-fast)}
.toggle-wrap input:checked+.toggle-track{background:var(--accent)}
.toggle-wrap input:checked+.toggle-track .toggle-knob{transform:translateX(20px)}

/* === TABS === */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:10px 20px;font-size:var(--font-sm);font-weight:600;color:var(--text-secondary);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:all var(--transition-fast)}
.tab:hover{color:var(--accent)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tabs-pill{border-bottom:none;gap:var(--space-xs);background:var(--bg-secondary);border-radius:var(--radius-sm);padding:3px}
.tabs-pill .tab{border-bottom:none;border-radius:6px;padding:6px 16px}
.tabs-pill .tab.active{background:var(--bg-card);color:var(--accent);box-shadow:var(--shadow-sm)}

/* === CARDS === */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-lg);transition:border-color var(--transition-fast)}
.card:hover{border-color:var(--accent)}
.card-title{font-size:var(--font-base);font-weight:900;color:var(--text);margin-bottom:var(--space-sm)}

/* === TABLE === */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:var(--font-sm)}
th,td{padding:10px 14px;text-align:left}
th{background:var(--bg-secondary);font-weight:700;color:var(--text-secondary);font-size:var(--font-xs);border-bottom:2px solid var(--border)}
td{border-bottom:1px solid var(--border)}
tr:hover td{background:var(--accent-light)}

/* === BADGE/TAG === */
.badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;font-size:var(--font-xs);font-weight:700;border-radius:var(--radius-xs);line-height:1.5}
.badge-accent{background:var(--accent);color:#fff}
.badge-light{background:var(--accent-light);color:var(--accent)}
.badge-muted{background:var(--bg-secondary);color:var(--text-muted)}
.badge-new{background:var(--color-error);color:#fff;min-width:22px;padding:2px 6px;border-radius:11px;font-size:11px}

/* === SPINNER === */
.spinner{display:inline-block;width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* === PROGRESS === */
.progress{width:100%;height:8px;background:var(--bg-secondary);border-radius:4px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:4px;transition:width var(--transition-normal)}

/* === LAYOUT === */
.container{max-width:var(--max-width);margin:0 auto;padding:var(--space-lg)}
.page{display:none}
.page.active{display:block}

/* === PORTAL === */
.portal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--space-lg)}
.portal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-xl);cursor:pointer;transition:all var(--transition-normal);position:relative;overflow:hidden}
.portal-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.portal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent);opacity:0;transition:opacity var(--transition-fast)}
.portal-card:hover::before{opacity:1}
.portal-icon{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-md);font-size:24px}
.portal-title{font-size:var(--font-lg);font-weight:900;color:var(--text);margin-bottom:var(--space-xs)}
.portal-desc{font-size:var(--font-sm);color:var(--text-secondary);line-height:1.7}

/* === DASHBOARD === */
.dash-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md);margin-bottom:var(--space-lg)}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-md)}
.stat-label{font-size:var(--font-xs);color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:var(--font-2xl);font-weight:900;color:var(--accent);margin:4px 0}
.stat-sub{font-size:var(--font-xs);color:var(--text-secondary)}

/* === TIMELINE === */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:var(--space-lg);animation:fadeIn .3s ease}
.tl-item::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);z-index:1}
.tl-item.important::before{background:var(--color-error);box-shadow:0 0 6px rgba(245,101,101,.6)}
.tl-time{font-family:var(--font-mono);font-size:var(--font-xs);color:var(--text-muted)}
.tl-source{display:inline-block;font-size:var(--font-xs);font-weight:700;color:var(--accent);background:var(--accent-light);padding:1px 6px;border-radius:var(--radius-xs);margin:0 6px}
.tl-title{font-size:var(--font-base);font-weight:500;color:var(--text);margin:4px 0}
.tl-title a{color:inherit}
.tl-title a:hover{color:var(--accent)}
.tl-summary{font-size:var(--font-sm);color:var(--text-secondary);margin-top:4px}
.tl-actions{display:flex;gap:var(--space-sm);margin-top:var(--space-xs)}
.tl-tag{font-size:var(--font-xs);color:var(--text-muted);background:var(--bg-secondary);padding:2px 6px;border-radius:var(--radius-xs)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* === SETTINGS PANEL (modal) === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:700px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal-header{padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:var(--font-lg);font-weight:900}
.modal-close{width:32px;height:32px;border:none;border-radius:var(--radius-xs);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.modal-close:hover{background:var(--bg-secondary);color:var(--text)}
.modal-body{padding:var(--space-lg);overflow-y:auto;flex:1}
.modal-footer{padding:var(--space-md) var(--space-lg);border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:var(--space-sm)}

/* === FORM GROUP === */
.form-group{margin-bottom:var(--space-md)}
.form-label{display:block;font-size:var(--font-sm);font-weight:600;color:var(--text);margin-bottom:var(--space-xs)}
.form-hint{font-size:var(--font-xs);color:var(--text-muted);margin-top:2px}
.form-row{display:flex;gap:var(--space-sm);align-items:flex-end}

/* === SOURCE LIST === */
.source-item{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border);transition:background var(--transition-fast)}
.source-item:hover{background:var(--accent-light)}
.source-item:last-child{border-bottom:none}
.source-name{flex:1;font-size:var(--font-sm);font-weight:500}
.source-url{font-size:var(--font-xs);color:var(--text-muted);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.source-type{font-size:var(--font-xs);font-weight:700;color:var(--accent);background:var(--accent-light);padding:1px 6px;border-radius:var(--radius-xs)}

/* === REPORT === */
.report-preview{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-lg);font-size:var(--font-sm);line-height:1.8;white-space:pre-wrap;max-height:500px;overflow-y:auto}

/* === ABOUT === */
.about-section{margin-bottom:var(--space-lg)}
.about-section h3{font-size:var(--font-base);font-weight:900;color:var(--accent);margin-bottom:var(--space-sm)}
.about-section p,.about-section li{font-size:var(--font-sm);color:var(--text-secondary);line-height:1.7}
.about-section ul{padding-left:20px;list-style:disc}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* === RESPONSIVE === */
@media(max-width:768px){
  .container{padding:var(--space-sm)}
  .portal-grid{grid-template-columns:1fr}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .form-row{flex-direction:column}
  .source-url{max-width:150px}
  .app-header{padding:0 var(--space-sm)}
}

/* === EMPTY STATE === */
.empty{text-align:center;padding:var(--space-xl);color:var(--text-muted)}
.empty-icon{font-size:48px;margin-bottom:var(--space-md)}
.empty-text{font-size:var(--font-base);margin-bottom:var(--space-md)}

/* === NOTIFICATION TOAST === */
.toast-container{position:fixed;top:calc(var(--header-height) + 8px);right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius-sm);padding:var(--space-sm) var(--space-md);box-shadow:var(--shadow-md);animation:slideIn .3s ease;font-size:var(--font-sm);max-width:360px}
.toast.error{border-left-color:var(--color-error)}
.toast.success{border-left-color:var(--color-success)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* === KEYWORD HIGHLIGHT === */
.kw-highlight{background:var(--accent-light);color:var(--accent);padding:0 2px;border-radius:2px;font-weight:600}
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header" id="appHeader">
  <div class="header-left">
    <span class="header-brand" id="headerBrand" onclick="goPortal()">行业监控系统</span>
    <span class="header-sub" id="headerSub"></span>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题" id="themeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
    </button>
    <button class="icon-btn" onclick="refreshData()" title="刷新数据" id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="icon-btn" onclick="openSettings()" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============ PORTAL PAGE ============ -->
<div class="page active" id="pagePortal">
  <div class="container">
    <div style="text-align:center;padding:var(--space-xl) 0">
      <h1 style="font-size:var(--font-2xl);font-weight:900;margin-bottom:var(--space-sm)">行业监控系统</h1>
      <p style="color:var(--text-secondary);margin-bottom:var(--space-xl)">娱乐资本论 · 全网内容实时巡检与自动化采集平台</p>
    </div>
    <div class="portal-grid" id="portalGrid"></div>
  </div>
</div>

<!-- ============ SYSTEM PAGE ============ -->
<div class="page" id="pageSystem">
  <div class="container">
    <!-- System Tabs -->
    <div class="tabs" id="sysTabs" style="margin-bottom:var(--space-lg)">
      <button class="tab active" data-tab="dashboard" onclick="switchTab(this)">仪表盘</button>
      <button class="tab" data-tab="sources" onclick="switchTab(this)">信息源</button>
      <button class="tab" data-tab="timeline" onclick="switchTab(this)">监控时间线</button>
      <button class="tab" data-tab="keywords" onclick="switchTab(this)">关键字</button>
      <button class="tab" data-tab="reports" onclick="switchTab(this)">报告</button>
    </div>

    <!-- Dashboard Tab -->
    <div class="tab-panel active" id="panelDashboard">
      <div class="dash-stats" id="dashStats"></div>
      <div class="card" style="margin-bottom:var(--space-lg)">
        <div class="card-title">最近监控动态</div>
        <div id="dashRecent"></div>
      </div>
    </div>

    <!-- Sources Tab -->
    <div class="tab-panel" id="panelSources" style="display:none">
      <div class="card" style="margin-bottom:var(--space-lg)">
        <div class="card-title">添加信息源</div>
        <div class="form-row">
          <div class="form-group" style="flex:1">
            <label class="form-label">名称</label>
            <input class="input-field" id="srcName" placeholder="如：泡泡玛特官方">
          </div>
          <div class="form-group" style="flex:2">
            <label class="form-label">URL</label>
            <input class="input-field" id="srcUrl" placeholder="RSS地址或网页URL">
          </div>
          <div class="form-group" style="width:140px">
            <label class="form-label">类型</label>
            <select class="input-field" id="srcType">
              <option value="rss">RSS</option>
              <option value="page">页面轮询</option>
              <option value="api">API接口</option>
            </select>
          </div>
          <div class="form-group" style="width:140px">
            <label class="form-label">分类</label>
            <input class="input-field" id="srcCategory" placeholder="默认">
          </div>
          <button class="btn btn-primary" onclick="addSource()" style="margin-bottom:0;align-self:flex-end">添加</button>
        </div>

}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }

}

// === DATA FETCHING ===
async function fetchWithProxy(url) {
  let lastErr = null;
  const cacheBust = `&_t=${Date.now()}`;
  for (const proxy of PROXY_LIST) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 15000);
      const resp = await fetch(proxy + encodeURIComponent(url) + cacheBust, {signal: ctrl.signal});
      clearTimeout(tid);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const buf = await resp.arrayBuffer();
      const text = new TextDecoder('utf-8').decode(buf);
      return text;
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

function parseRSS(xmlText, sourceInfo) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'text/xml');
    const items = doc.querySelectorAll('item, entry');
    const results = [];
    items.forEach(item => {
      let title = item.querySelector('title')?.textContent?.trim();
      let link = item.querySelector('link')?.textContent?.trim();
      if (!link) {
        const linkEl = item.querySelector('link[href]');
        if (linkEl) link = linkEl.getAttribute('href');
      }
      let pubDate = item.querySelector('pubDate, published, updated')?.textContent?.trim();
      if (!title || !link) return;

      // Clean Google News style titles
      let source = sourceInfo.name;
      if (title.includes(' - ') && title.split(' - ').pop().length < 20) {
        source = title.split(' - ').pop();
        title = title.split(' - ').slice(0, -1).join(' - ');
      }

      let ts = Date.now();
      if (pubDate) { const p = new Date(pubDate).getTime(); if (!isNaN(p)) ts = p; }

      results.push({
        id: link + '_' + ts,
        title, url: link, source, sourceId: sourceInfo.id,
        timestamp: ts, type: sourceInfo.type,
        category: sourceInfo.category || '默认',
        read: false, important: false
      });
    });
    return results.slice(0, 10);
  } catch(e) { console.warn('RSS parse error:', e); return []; }
}

function parsePage(htmlText, sourceInfo, snapshot) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');
    // Extract text content from body, strip scripts/styles
    const body = doc.body;
    if (!body) return [];
    const scripts = body.querySelectorAll('script,style,nav,footer,header');
    scripts.forEach(s => s.remove());
    const text = body.innerText || body.textContent || '';
    const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length > 10);

    if (!snapshot) {
      // First visit - just store snapshot, no diff
      return [];
    }

    // Simple diff: find lines in current that weren't in snapshot
    const oldSet = new Set(snapshot.split('\n').map(l=>l.trim()).filter(l=>l.length>10));
    const newLines = lines.filter(l => !oldSet.has(l));

    return newLines.slice(0, 20).map((line, i) => ({
      id: sourceInfo.id + '_' + Date.now() + '_' + i,
      title: line.substring(0, 120),
      url: sourceInfo.url,
      source: sourceInfo.name,
      sourceId: sourceInfo.id,
      timestamp: Date.now(),
      type: 'page',
      category: sourceInfo.category || '默认',
      read: false,
      important: false
    }));
  } catch(e) { console.warn('Page parse error:', e); return []; }
}

async function refreshData() {
  if (!currentSys) return;
  const d = sysData[currentSys];
  if (d.loading) return;
  d.loading = true;

  const btn = document.getElementById('refreshBtn');
  btn.style.opacity = '0.5';

  let newItems = [];
  let successCount = 0;
  let failCount = 0;

  const enabledSources = d.sources.filter(s => s.enabled);
  const promises = enabledSources.map(async (src) => {
    try {
      const html = await fetchWithProxy(src.url);
      let items = [];
      if (src.type === 'rss') {
        items = parseRSS(html, src);
      } else {
        // Page or API - check for changes
        const oldSnapshot = d.snapshots[src.id] || null;
        items = parsePage(html, src, oldSnapshot);
        // Update snapshot
        d.snapshots[src.id] = html;
        lsSet(sk(currentSys, 'snapshots'), d.snapshots);
      }
      successCount++;
      return items;
    } catch(e) {
      console.warn(`Fetch failed for ${src.name}:`, e.message);
      failCount++;
      return [];
    }
  });

  const results = await Promise.allSettled(promises);
  results.forEach(r => {
    if (r.status === 'fulfilled' && r.value) newItems.push(...r.value);
  });

  // Deduplicate by URL+title
  const existIds = new Set(d.items.map(i => i.url + i.title));
  const unique = newItems.filter(i => !existIds.has(i.url + i.title));

  // Keyword matching
  const allKw = [...d.keywords, ...d.alertKeywords];
  unique.forEach(item => {
    const text = (item.title || '').toLowerCase();
    allKw.forEach(kw => {
      if (text.includes(kw.toLowerCase())) {
        item.important = true;
      }
    });
  });

  // Merge and trim
  d.items = [...unique, ...d.items].slice(0, d.settings.maxItems);
  lsSet(sk(currentSys, 'items'), d.items);

  // Check alert keywords for notifications
  if (d.settings.notifications && unique.length > 0) {
    const alertItems = unique.filter(item => {
      const text = (item.title || '').toLowerCase();
      return d.alertKeywords.some(kw => text.includes(kw.toLowerCase()));
    });
    if (alertItems.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
      new Notification(`${SYSTEMS[currentSys].name} - 告警`, {
        body: `发现${alertItems.length}条告警信息：${alertItems[0].title.substring(0,50)}...`,
        icon: '📋'
      });
    }
  }

  d.loading = false;
  btn.style.opacity = '1';

  if (unique.length > 0) {
    toast(`新增 ${unique.length} 条内容，成功 ${successCount}/${enabledSources.length} 个源`, 'success');
  } else {
    toast(`已刷新，成功 ${successCount}/${enabledSources.length} 个源`, successCount > 0 ? 'success' : 'error');
  }

  renderDashboard();
  renderTimeline();
}

  const importantCount = d.items.filter(i=>i.important).length;

async function generateReport(type) {
  if (!currentSys) return;
  const d = sysData[currentSys];
  const sys = SYSTEMS[currentSys];
  const date = document.getElementById('reportDate').value;
  const useAI = document.getElementById('useAI').checked;

  const startDate = new Date(date);
  const endDate = new Date(date);
  if (type === 'weekly') startDate.setDate(startDate.getDate() - 7);

  const items = d.items.filter(i => i.timestamp >= startDate.getTime() && i.timestamp <= endDate.getTime() + 86400000);

  let report = '';
  const dateLabel = type === 'daily' ? date : `${startDate.toISOString().split('T')[0]} ~ ${date}`;
  report += `${sys.name} - ${type==='daily'?'日报':'周报'}\n`;
  report += `报告日期：${dateLabel}\n`;
  report += `生成时间：${new Date().toLocaleString('zh-CN')}\n`;
  report += `${'='.repeat(40)}\n\n`;

  if (items.length === 0) {
    report += '本期无监控数据。\n';
  } else {
    report += `本期共采集 ${items.length} 条信息，其中重要/告警 ${items.filter(i=>i.important).length} 条。\n\n`;

    // Group by category
    const groups = {};
    items.forEach(i => { const c = i.category||'默认'; if(!groups[c]) groups[c]=[]; groups[c].push(i); });

    for (const [cat, catItems] of Object.entries(groups)) {
      report += `【${cat}】(${catItems.length}条)\n`;
      catItems.slice(0, 20).forEach(item => {
        const time = new Date(item.timestamp).toLocaleString('zh-CN');
        report += `  ${item.important?'⚠️':'•'} [${time}] ${item.source}: ${item.title}\n`;
        if (item.url) report += `    ${item.url}\n`;
      });
      if (catItems.length > 20) report += `  ...及其他 ${catItems.length-20} 条\n`;
      report += '\n';
    }

    // AI Summary
    if (useAI && items.length > 0) {
      report += `${'='.repeat(40)}\n`;
      report += `AI 摘要（智谱Flash）\n`;
      report += `${'─'.repeat(30)}\n`;

      try {
        const summaryText = items.slice(0, 30).map(i => `[${i.source}] ${i.title}`).join('\n');
        const prompt = `你是${sys.name}的数据分析师。请根据以下监控数据，生成一份${type==='daily'?'日':'周'}报摘要，包括：1. 重大事件和趋势；2. 需要关注的风险点；3. 行业动态总结。要求简明扼要，中文输出。\n\n监控数据：\n${summaryText}`;

        const aiSummary = await callZhipuAPI(prompt);
        report += aiSummary + '\n';
      } catch(e) {
        report += `AI摘要生成失败：${e.message}\n`;
      }
    }
  }

  document.getElementById('reportPreview').textContent = report;
  toast('报告已生成', 'success');
}

async function callZhipuAPI(prompt) {
  const resp = await fetch(ZHIPU_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${ZHIPU_API_KEY}`
    },
    body: JSON.stringify({
      model: 'glm-4-flash',
      messages: [
        {role: 'user', content: prompt}
      ],
      temperature: 0.7,
      max_tokens: 1000
    })
  });

  if (!resp.ok) throw new Error(`API Error ${resp.status}`);
  const data = await resp.json();
  return data.choices?.[0]?.message?.content || '无摘要内容';
}

function updateSetting(key, val) {
  if (!currentSys) return;
  const d = sysData[currentSys];
  d.settings[key] = val;
  lsSet(sk(currentSys,'settings'), d.settings);

  // Apply auto-refresh change
  if (key === 'autoRefresh' || key === 'fetchInterval') {
    clearInterval(refreshTimer);
    if (d.settings.autoRefresh) {
      refreshTimer = setInterval(() => refreshData(), d.settings.fetchInterval * 60000);
    }
  }
}

function importAllSettings() {
  if (!currentSys) return;
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const d = sysData[currentSys];
        if (data.sources) { d.sources = data.sources; lsSet(sk(currentSys,'sources'), d.sources); }
        if (data.keywords) { d.keywords = data.keywords; lsSet(sk(currentSys,'keywords'), d.keywords); }
        if (data.alertKeywords) { d.alertKeywords = data.alertKeywords; lsSet(sk(currentSys,'alertKeywords'), d.alertKeywords); }

        renderKeywords();

  const d = sysData[currentSys];
  d.items = [];
  d.snapshots = {};
  lsSet(sk(currentSys,'items'), []);
  lsSet(sk(currentSys,'snapshots'), {});
  renderDashboard();
  renderTimeline();
  toast('数据已清空');
  renderSettings();
}

// === HELPERS ===
function formatTime(ts) {
  if (!ts) return '--:--';
  const d = new Date(ts);
  return d.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightKw(text) {
  if (!currentSys) return text;
  const d = sysData[currentSys];
  const allKw = [...d.keywords, ...d.alertKeywords].sort((a,b) => b.length - a.length);
  let result = text;
  allKw.forEach(kw => {
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    result = result.replace(re, match => `<span class="kw-highlight">${match}</span>`);
  });
  return result;
}

// === START ===
init();
</script>
