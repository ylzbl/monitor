<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行业监控系统 | 娱乐资本论</title>
<link rel="stylesheet" href="common.css">
<style>
.hero{text-align:center;padding:var(--space-xl) 0 var(--space-lg)}
.hero h1{font-size:var(--font-2xl);font-weight:900;margin-bottom:var(--space-sm);background:linear-gradient(135deg,#E91E8C,#7C3AED,#1565C0,#0D9488);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--text-secondary);font-size:var(--font-base);max-width:600px;margin:0 auto;line-height:1.8}
.hero-stats{display:flex;justify-content:center;gap:var(--space-xl);margin-top:var(--space-lg);flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat .val{font-size:var(--font-2xl);font-weight:900;color:var(--accent)}
.hero-stat .label{font-size:var(--font-xs);color:var(--text-muted);margin-top:2px}
.update-notify{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:20px;font-size:var(--font-xs);font-weight:700;margin-top:var(--space-md);animation:pulse-badge 2s ease infinite}
.update-notify.has{background:var(--ok)20;color:var(--ok)}
.update-notify.none{background:var(--bg-secondary);color:var(--text-muted)}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-left">
    <span class="hdr-brand">行业监控系统</span>
    <span class="hdr-sub">娱乐资本论</span>
  </div>
  <div class="hdr-right">
    <button class="ibtn" onclick="toggleTheme()" title="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg></button>
    <button class="ibtn" onclick="refreshAll()" title="刷新全部" id="rfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
    <button class="ibtn" onclick="openGlobalSettings()" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>
<div class="ld-bar" id="ldBar"></div>
<div class="tc" id="tc"></div>

<div class="ctn">
  <div class="hero">
    <h1>行业监控系统</h1>
    <p>娱乐资本论 · 全网内容实时巡检与自动化采集平台<br>覆盖潮玩、广电、票房、短剧、传媒上市公司五大行业板块</p>
    <div class="hero-stats" id="heroStats"></div>
    <div id="updateNotify"></div>
  </div>
  <div class="ptl-g" id="ptlGrid"></div>
</div>

<div class="mdl-o" id="sModal">
  <div class="mdl">
    <div class="mdl-h"><span class="mdl-t">系统设置</span><button class="mdl-x" onclick="document.getElementById('sModal').classList.remove('on')">&times;</button></div>
    <div class="mdl-b" id="sBody"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
/* === PORTAL PAGE LOGIC === */
let sysData = {};
let autoRefreshDone = false;

function init() {
  initGlobalConfig();
  for (const id of Object.keys(SYS)) {
    sysData[id] = initSysData(id);
  }
  renderPortal();
  // Auto-refresh on first load
  if (!autoRefreshDone) {
    autoRefreshDone = true;
    setTimeout(() => refreshAll(), 1000);
  }
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}

function renderPortal() {
  const g = document.getElementById('ptlGrid');
  let totalSources = 0, totalItems = 0, totalToday = 0;
  g.innerHTML = Object.values(SYS).map(s => {
    const d = sysData[s.id];
    const en = d.sources.filter(x => x.enabled).length;
    const total = d.items.length;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayN = d.items.filter(i => i.ts >= today.getTime()).length;
    const hasUpdate = todayN > 0;
    totalSources += en;
    totalItems += total;
    totalToday += todayN;
    return `<div class="ptl-c ${hasUpdate?'has-update':''}" onclick="location.href='${s.file}'" style="--accent:${s.accent}">
      <div class="ptl-i">${s.icon}</div>
      <div class="ptl-t">${s.name}</div>
      <div class="ptl-d">${s.desc}</div>
      <div style="margin-top:var(--space-md);display:flex;gap:var(--space-md)">
        <span class="ptl-badge ${hasUpdate?'has-update':''}">${en} 信息源</span>
        <span class="ptl-badge">${total} 监控项</span>
        ${todayN > 0 ? `<span class="ptl-badge" style="background:${s.accent};color:#fff">${todayN} 今日新增</span>` : ''}
      </div>
    </div>`;
  }).join('');
  // Hero stats
  document.getElementById('heroStats').innerHTML = `
    <div class="hero-stat"><div class="val">${Object.keys(SYS).length}</div><div class="label">监控板块</div></div>
    <div class="hero-stat"><div class="val">${totalSources}</div><div class="label">活跃信息源</div></div>
    <div class="hero-stat"><div class="val">${totalItems}</div><div class="label">监控条目</div></div>
    <div class="hero-stat"><div class="val">${totalToday}</div><div class="label">今日新增</div></div>`;
  // Update notification
  const notifyEl = document.getElementById('updateNotify');
  if (totalToday > 0) {
    notifyEl.innerHTML = `<span class="update-notify has">&#9679; 今日已更新 ${totalToday} 条内容</span>`;
  } else {
    notifyEl.innerHTML = `<span class="update-notify none">暂无今日更新</span>`;
  }
}

async function refreshAll() {
  const btn = document.getElementById('rfBtn');
  btn.style.opacity = '0.5';
  ldBar(5);
  let totalOk = 0, totalFail = 0;
  const ids = Object.keys(SYS);
  for (let si = 0; si < ids.length; si++) {
    const id = ids[si];
    const d = sysData[id];
    ldBar(5 + 90 * (si / ids.length));
    const enabled = d.sources.filter(s => s.enabled);
    let ok = 0, fail = 0;
    for (const src of enabled) {
      try {
        let items = [];
        if (src.type === 'rss') {
          try {
            const ctrl = new AbortController(); const tid = setTimeout(() => ctrl.abort(), 12000);
            const resp = await fetch(RSS2JSON + encodeURIComponent(src.url), {signal: ctrl.signal});
            clearTimeout(tid);
            if (resp.ok) { const data = await resp.json(); if (data.status === 'ok' && data.items?.length) items = parseRSS2JSON(data, src); }
          } catch(e) {}
          if (!items.length) { try { const xml = await fetchProxy(src.url); items = parseRSS(xml, src); } catch(e) {} }
          items.length ? ok++ : fail++;
        } else {
          try {
            const html = await fetchProxy(src.url);
            const oldSnap = d.snaps[src.id] || null;
            items = parsePage(html, src, oldSnap);
            d.snaps[src.id] = html; ls(sk(id, 'snap'), d.snaps);
            ok++;
          } catch(e) { fail++; }
        }
        // Relevance filter
        const allKw = [...d.keywords, ...d.alertKw];
        const filtered = items.filter(item => {
          if (item.type === 'page') return true;
          return kwMatch(item.title || '', allKw);
        });
        items = filtered;
        items.forEach(item => {
          if (kwMatch(item.title || '', allKw)) item.important = true;
        });
        // Dedup
        const existIds = new Set(d.items.map(i => i.url + '|' + i.title));
        const unique = items.filter(i => !existIds.has(i.url + '|' + i.title));
        d.items = [...unique, ...d.items].slice(0, d.cfg.maxItems);
        ls(sk(id, 'items'), d.items);
      } catch(e) { fail++; }
    }
    totalOk += ok; totalFail += fail;
  }
  ldBar(100);
  btn.style.opacity = '1';
  toast(`全部刷新完成 (成功 ${totalOk} / 失败 ${totalFail})`, totalOk > 0 ? 'ok' : 'err');
  renderPortal();
  // Notify for alerts
  if ('Notification' in window && Notification.permission === 'granted') {
    for (const id of Object.keys(SYS)) {
      const d = sysData[id];
      const today = new Date(); today.setHours(0,0,0,0);
      const alerts = d.items.filter(i => i.ts >= today.getTime() && i.important);
      if (alerts.length > 0) {
        try { new Notification(SYS[id].name, {body: `${alerts.length}条告警：${alerts[0].title.substring(0,50)}`}); } catch(e) {}
      }
    }
  }
}

function openGlobalSettings() {
  document.getElementById('sModal').classList.add('on');
  document.getElementById('sBody').innerHTML = renderSettingsBody(null, sysData);
}

function exportAllSystems() {
  const data = {version: V, systems: {}};
  for (const id of Object.keys(SYS)) {
    const d = sysData[id];
    data.systems[id] = {sources: d.sources, keywords: d.keywords, alertKw: d.alertKw, aiPrompt: d.aiPrompt, settings: d.cfg};
  }
  exportSettingsJSON(data, 'monitor_all_config.json');
}

function importAllSystems() {
  importJSON(data => {
    if (data.systems) {
      for (const [id, sd] of Object.entries(data.systems)) {
        const d = sysData[id]; if (!d) continue;
        if (sd.sources) { d.sources = sd.sources; ls(sk(id, 'src'), d.sources); }
        if (sd.keywords) { d.keywords = sd.keywords; ls(sk(id, 'kw'), d.keywords); }
        if (sd.alertKw) { d.alertKw = sd.alertKw; ls(sk(id, 'akw'), d.alertKw); }
        if (sd.aiPrompt) { d.aiPrompt = sd.aiPrompt; ls(sk(id, 'aiprompt'), d.aiPrompt); }
        if (sd.settings) { d.cfg = Object.assign(d.cfg, sd.settings); ls(sk(id, 'cfg'), d.cfg); }
      }
    }
    toast('设置已导入', 'ok');
    renderPortal();
  });
}

init();
</script>
</body>
</html>
