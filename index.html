<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行业监控系统 | 娱乐资本论</title>
<style>
/* === RESET === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
img,svg{max-width:100%;height:auto;display:block}
ul,ol{list-style:none}
button,input,select,textarea{font-family:inherit}

/* === TOKENS === */
:root{
  --accent:#347df8;--accent-hover:#2768d9;--accent-light:rgba(52,125,248,.10);
  --bg:#F7FAFC;--bg-card:#FFF;--bg-secondary:#EDF2F7;--bg-hover:#E2E8F0;
  --text:#1A202C;--text-secondary:#718096;--text-muted:#A0AEC0;
  --border:#E2E8F0;--border-medium:#CBD5E0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:12px;--radius-sm:8px;--radius-xs:4px;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","Source Han Sans",sans-serif;
  --font-mono:SFMono-Regular,Consolas,Menlo,monospace;
  --font-xs:12px;--font-sm:14px;--font-base:16px;--font-lg:20px;--font-xl:24px;--font-2xl:32px;
  --fast:.15s ease;--normal:.25s ease;
  --max-w:1200px;--hdr-h:56px;
  --ok:#48BB78;--warn:#ECC94B;--err:#F56565;--info:#4299E1;
}
[data-theme="dark"]{
  --bg:#0D1117;--bg-card:#161b22;--bg-secondary:#21262d;--bg-hover:#30363d;
  --text:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;
  --border:#30363d;--border-medium:#444c56;
  --accent-light:rgba(52,125,248,.15);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 24px rgba(0,0,0,.5);
}

/* === SUBSYSTEM ACCENTS === */
[data-sys="chaowan"]{--accent:#E91E8C;--accent-hover:#C41878;--accent-light:rgba(233,30,140,.10)}
[data-theme="dark"][data-sys="chaowan"]{--accent-light:rgba(233,30,140,.15)}
[data-sys="guangdian"]{--accent:#1565C0;--accent-hover:#0D47A1;--accent-light:rgba(21,101,192,.10)}
[data-theme="dark"][data-sys="guangdian"]{--accent-light:rgba(21,101,192,.15)}
[data-sys="piaofang"]{--accent:#D97706;--accent-hover:#B45309;--accent-light:rgba(217,119,6,.10)}
[data-theme="dark"][data-sys="piaofang"]{--accent-light:rgba(217,119,6,.15)}
[data-sys="duanju"]{--accent:#7C3AED;--accent-hover:#6D28D9;--accent-light:rgba(124,58,237,.10)}
[data-theme="dark"][data-sys="duanju"]{--accent-light:rgba(124,58,237,.15)}
[data-sys="shangshi"]{--accent:#0D9488;--accent-hover:#0F766E;--accent-light:rgba(13,148,136,.10)}
[data-theme="dark"][data-sys="shangshi"]{--accent-light:rgba(13,148,136,.15)}

/* === BASE === */
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;font-size:var(--font-base);min-height:100vh}
a{color:var(--accent);text-decoration:none;transition:color var(--fast)}
a:hover{color:var(--accent-hover)}
button{cursor:pointer}

/* === HEADER === */
.hdr{position:sticky;top:0;z-index:100;background:var(--bg-card);border-bottom:1px solid var(--border);height:var(--hdr-h);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-lg);backdrop-filter:blur(12px)}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-brand{font-size:18px;font-weight:900;cursor:pointer}
.hdr-sub{font-size:var(--font-xs);color:var(--text-muted)}
.hdr-right{display:flex;align-items:center;gap:8px}

/* === BUTTONS === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;font-size:var(--font-sm);font-weight:600;border-radius:var(--radius-sm);border:1px solid transparent;transition:all var(--fast);line-height:1.5;white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-p:hover:not(:disabled){background:var(--accent-hover)}
.btn-s{background:var(--bg-secondary);color:var(--text);border-color:var(--border)}.btn-s:hover:not(:disabled){background:var(--bg-hover)}
.btn-o{background:transparent;color:var(--accent);border-color:var(--accent)}.btn-o:hover:not(:disabled){background:var(--accent-light)}
.btn-g{background:transparent;color:var(--text-secondary);border:none}.btn-g:hover:not(:disabled){background:var(--bg-secondary);color:var(--text)}
.btn-d{background:var(--err);color:#fff;border-color:var(--err)}
.btn-sm{padding:4px 12px;font-size:var(--font-xs);border-radius:var(--radius-xs)}
.ibtn{width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all var(--fast)}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn svg{width:18px;height:18px}

/* === INPUTS === */
.inp{padding:8px 12px;font-size:var(--font-sm);border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text);outline:none;transition:border-color var(--fast);line-height:1.5;width:100%}
.inp::placeholder{color:var(--text-muted)}.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
textarea.inp{resize:vertical}

/* === TOGGLE === */
.tog{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--font-sm);user-select:none}
.tog-t{position:relative;width:44px;height:24px;flex-shrink:0;background:var(--border-medium);border-radius:12px;transition:background var(--fast)}
.tog input{position:absolute;opacity:0;width:0;height:0}
.tog-k{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform var(--fast)}
.tog input:checked+.tog-t{background:var(--accent)}.tog input:checked+.tog-t .tog-k{transform:translateX(20px)}

/* === TABS === */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:10px 20px;font-size:var(--font-sm);font-weight:600;color:var(--text-secondary);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:all var(--fast);white-space:nowrap}
.tab:hover{color:var(--accent)}.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* === CARDS === */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-lg);transition:border-color var(--fast)}
.card:hover{border-color:var(--accent)}
.card-t{font-size:var(--font-base);font-weight:900;margin-bottom:var(--space-sm)}

/* === TABLE === */
.tbl-w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:var(--font-sm)}
th,td{padding:10px 14px;text-align:left}
th{background:var(--bg-secondary);font-weight:700;color:var(--text-secondary);font-size:var(--font-xs);border-bottom:2px solid var(--border)}
td{border-bottom:1px solid var(--border)}tr:hover td{background:var(--accent-light)}

/* === BADGE === */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;font-size:var(--font-xs);font-weight:700;border-radius:var(--radius-xs);line-height:1.5}
.bdg-a{background:var(--accent);color:#fff}
.bdg-l{background:var(--accent-light);color:var(--accent)}
.bdg-m{background:var(--bg-secondary);color:var(--text-muted)}

/* === SPINNER === */
.spin{display:inline-block;width:24px;height:24px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* === LAYOUT === */
.ctn{max-width:var(--max-w);margin:0 auto;padding:var(--space-lg)}
.pg{display:none}.pg.on{display:block}

/* === PORTAL === */
.ptl-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--space-lg)}
.ptl-c{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-xl);cursor:pointer;transition:all var(--normal);position:relative;overflow:hidden}
.ptl-c:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.ptl-c::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent);opacity:0;transition:opacity var(--fast)}
.ptl-c:hover::before{opacity:1}
.ptl-i{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-md);font-size:24px}
.ptl-t{font-size:var(--font-lg);font-weight:900;margin-bottom:var(--space-xs)}
.ptl-d{font-size:var(--font-sm);color:var(--text-secondary);line-height:1.7}

/* === DASHBOARD === */
.ds-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md);margin-bottom:var(--space-lg)}
.ds-c{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-md)}
.ds-l{font-size:var(--font-xs);color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.ds-v{font-size:var(--font-2xl);font-weight:900;color:var(--accent);margin:4px 0}
.ds-s{font-size:var(--font-xs);color:var(--text-secondary)}

/* === DASHBOARD CHARTS === */
.ds-charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg);margin-bottom:var(--space-lg)}
.ds-chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-md)}
.ds-chart-title{font-size:var(--font-sm);font-weight:700;color:var(--text-secondary);margin-bottom:var(--space-sm)}
.ds-chart-wrap{position:relative;width:100%;min-height:200px}
.ds-chart-wrap svg{width:100%;height:100%}
.ds-map{grid-column:1/-1}
.ds-map svg{max-height:260px;margin:0 auto}

/* === TIMELINE === */
.tl{position:relative;padding-left:24px}
.tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-i{position:relative;padding-bottom:var(--space-lg);animation:fi .3s ease}
.tl-i::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);z-index:1}
.tl-i.imp::before{background:var(--err);box-shadow:0 0 6px rgba(245,101,101,.6)}
.tl-tm{font-family:var(--font-mono);font-size:var(--font-xs);color:var(--text-muted)}
.tl-src{display:inline-block;font-size:var(--font-xs);font-weight:700;color:var(--accent);background:var(--accent-light);padding:1px 6px;border-radius:var(--radius-xs);margin:0 6px}
.tl-tt{font-size:var(--font-base);font-weight:500;margin:4px 0}.tl-tt a{color:inherit}.tl-tt a:hover{color:var(--accent)}
.tl-url{font-size:var(--font-xs);color:var(--text-muted);font-family:var(--font-mono);word-break:break-all;margin-top:2px}
.tl-sum{font-size:var(--font-sm);color:var(--text-secondary);margin-top:4px}
.tl-act{display:flex;gap:var(--space-sm);margin-top:var(--space-xs)}
.tl-tag{font-size:var(--font-xs);color:var(--text-muted);background:var(--bg-secondary);padding:2px 6px;border-radius:var(--radius-xs)}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* === MODAL === */
.mdl-o{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.mdl-o.on{display:flex}
.mdl{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:700px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.mdl-h{padding:var(--space-md) var(--space-lg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mdl-t{font-size:var(--font-lg);font-weight:900}
.mdl-x{width:32px;height:32px;border:none;border-radius:var(--radius-xs);background:transparent;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:18px}
.mdl-x:hover{background:var(--bg-secondary);color:var(--text)}
.mdl-b{padding:var(--space-lg);overflow-y:auto;flex:1}

/* === FORM === */
.fg{margin-bottom:var(--space-md)}
.fl{display:block;font-size:var(--font-sm);font-weight:600;margin-bottom:var(--space-xs)}
.fh{font-size:var(--font-xs);color:var(--text-muted);margin-top:2px}
.fr{display:flex;gap:var(--space-sm);align-items:flex-end}

/* === SOURCE ITEM === */
.si{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border);transition:background var(--fast)}
.si:hover{background:var(--accent-light)}.si:last-child{border-bottom:none}
.si-n{flex:1;font-size:var(--font-sm);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-u{font-size:var(--font-xs);color:var(--text-muted);font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.si-t{font-size:var(--font-xs);font-weight:700;color:var(--accent);background:var(--accent-light);padding:1px 6px;border-radius:var(--radius-xs);flex-shrink:0}

/* === REPORT PREVIEW === */
.rp{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-lg);font-size:var(--font-sm);line-height:1.8;white-space:pre-wrap;max-height:500px;overflow-y:auto}

/* === ABOUT === */
.abt{margin-bottom:var(--space-lg)}.abt h3{font-size:var(--font-base);font-weight:900;color:var(--accent);margin-bottom:var(--space-sm)}
.abt p,.abt li{font-size:var(--font-sm);color:var(--text-secondary);line-height:1.7}.abt ul{padding-left:20px;list-style:disc}

/* === EMPTY === */
.emp{text-align:center;padding:var(--space-xl);color:var(--text-muted)}
.emp-i{font-size:48px;margin-bottom:var(--space-md)}.emp-t{font-size:var(--font-base);margin-bottom:var(--space-md)}

/* === TOAST === */
.tc{position:fixed;top:calc(var(--hdr-h) + 8px);right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tst{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius-sm);padding:var(--space-sm) var(--space-md);box-shadow:var(--shadow-md);animation:si2 .3s ease;font-size:var(--font-sm);max-width:360px;pointer-events:auto}
.tst.err{border-left-color:var(--err)}.tst.ok{border-left-color:var(--ok)}
@keyframes si2{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* === KEYWORD HIGHLIGHT === */
.kw-h{background:var(--accent-light);color:var(--accent);padding:0 2px;border-radius:2px;font-weight:600}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* === LOADING BAR === */
.ld-bar{position:fixed;top:var(--hdr-h);left:0;height:3px;background:var(--accent);z-index:150;transition:width .3s ease;opacity:0}
.ld-bar.on{opacity:1}

/* === PRINT === */
@media print{
  .hdr,.ld-bar,.tc,.tabs,.tl-act,.btn,button,.mdl-o{display:none!important}
  body{background:#fff!important;color:#000!important;font-size:12px!important}
  .pg{display:block!important}.tp{display:block!important}
  .card{border:1px solid #ccc!important;break-inside:avoid}
  a{color:#000!important;text-decoration:underline!important}
  .tl-url{display:block!important}
  .ds-c{border:1px solid #ccc!important}
  .ptl-c{border:1px solid #ccc!important;break-inside:avoid}
  [data-theme="dark"]{--bg:#fff;--bg-card:#fff;--text:#000;--border:#ccc}
}

/* === RESPONSIVE === */
@media(max-width:768px){
  .ctn{padding:var(--space-sm)}
  .ptl-g{grid-template-columns:1fr}
  .ds-g{grid-template-columns:repeat(2,1fr)}
  .ds-charts{grid-template-columns:1fr}
  .fr{flex-direction:column}
  .si-u{max-width:120px}
  .hdr{padding:0 var(--space-sm)}
  .tab{padding:8px 12px;font-size:var(--font-xs)}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr" id="hdr">
  <div class="hdr-left">
    <span class="hdr-brand" id="hBrand" onclick="goPortal()">行业监控系统</span>
    <span class="hdr-sub" id="hSub"></span>
  </div>
  <div class="hdr-right">
    <button class="ibtn" onclick="toggleTheme()" title="切换主题" id="themeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
    </button>
    <button class="ibtn" onclick="refreshData()" title="刷新数据" id="rfBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="ibtn" onclick="window.print()" title="打印">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </button>
    <button class="ibtn" onclick="openSettings()" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- LOADING BAR -->
<div class="ld-bar" id="ldBar"></div>

<!-- TOAST CONTAINER -->
<div class="tc" id="tc"></div>

<!-- ===== PORTAL ===== -->
<div class="pg on" id="pgPortal">
  <div class="ctn">
    <div style="text-align:center;padding:var(--space-xl) 0">
      <h1 style="font-size:var(--font-2xl);font-weight:900;margin-bottom:var(--space-sm)">行业监控系统</h1>
      <p style="color:var(--text-secondary);margin-bottom:var(--space-xl)">娱乐资本论 · 全网内容实时巡检与自动化采集平台</p>
    </div>
    <div class="ptl-g" id="ptlGrid"></div>
  </div>
</div>

<!-- ===== SYSTEM PAGE ===== -->
<div class="pg" id="pgSys">
  <div class="ctn">
    <div class="tabs" id="sysTabs" style="margin-bottom:var(--space-lg)">
      <button class="tab on" data-tab="dashboard" onclick="swTab(this)">仪表盘</button>
      <button class="tab" data-tab="sources" onclick="swTab(this)">信息源</button>
      <button class="tab" data-tab="timeline" onclick="swTab(this)">监控时间线</button>
      <button class="tab" data-tab="keywords" onclick="swTab(this)">关键字</button>
      <button class="tab" data-tab="reports" onclick="swTab(this)">报告</button>
    </div>

    <!-- Dashboard -->
    <div class="tp on" id="pDash">
      <div class="ds-g" id="dsStats"></div>
      <div class="ds-charts" id="dsCharts">
        <div class="ds-chart-card ds-map" id="dsMapCard">
          <div class="ds-chart-title">信息源地理分布</div>
          <div class="ds-chart-wrap" id="dsMap"></div>
        </div>
        <div class="ds-chart-card" id="dsPieCard">
          <div class="ds-chart-title">分类分布</div>
          <div class="ds-chart-wrap" id="dsPie"></div>
        </div>
        <div class="ds-chart-card" id="dsBarCard">

// === STORAGE HELPERS ===
function sk(id, k) { return `mon_${id}_${k}`; }
function lg(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function ls(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { console.warn('LS fail:', e); } }

// === GOOGLE NEWS RSS BUILDER ===
function buildGNewsRSS(query) {
  return `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=zh-CN&gl=CN&ceid=CN:zh-Hans`;
}

// === INIT ===
function init() {
  for (const [id, sys] of Object.entries(SYS)) {
    const sources = lg(sk(id,'src'), null);
    const items = lg(sk(id,'items'), []);
    const keywords = lg(sk(id,'kw'), null);
    const alertKw = lg(sk(id,'akw'), null);
    const settings = lg(sk(id,'cfg'), {});
    const snaps = lg(sk(id,'snap'), {});
    const aiPrompt = lg(sk(id,'aiprompt'), null);

    D[id] = {
      sources: sources || sys.defaultSources.map((s,i) => ({...s, id:`${id}_s${i}`, enabled:true})),
      items, keywords: keywords || sys.defaultKeywords,
      alertKw: alertKw || sys.defaultAlertKeywords,
      aiPrompt: aiPrompt || sys.defaultAIPrompt || '',
      cfg: Object.assign({interval:30, auto:true, notif:true, maxItems:500, blacklist:'', whitelist:'', notifFreq:'realtime', reportTime:'18:00'}, settings),
      snaps, loading:false
    };
    if (sources === null) ls(sk(id,'src'), D[id].sources);
    if (keywords === null) ls(sk(id,'kw'), D[id].keywords);
    if (alertKw === null) ls(sk(id,'akw'), D[id].alertKw);
    if (aiPrompt === null) ls(sk(id,'aiprompt'), D[id].aiPrompt);
  }
  // Global AI config - no stored keys
  if (!localStorage.getItem('mon_ai_cfg')) {
    // Default config with test key - user should replace with own key for production
    ls('mon_ai_cfg', {provider:'zhipu', url:'https://open.bigmodel.cn/api/paas/v4/chat/completions', model:'glm-4-flash', key:'89cf52e166744146a966eb905597a5ba.YvQflJOFgM3yX1o8', summarizePrompt:'', dedupPrompt:''});
  }
  document.documentElement.setAttribute('data-theme', lg('mon_theme', 'light'));
  route();
  window.addEventListener('hashchange', route);
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}

function route() {
  const h = location.hash.slice(1);
  if (h && SYS[h]) enterSys(h); else showPortal();
}

// === PORTAL ===
function showPortal() {
  curSys = null; clearInterval(rTimer);
  document.documentElement.removeAttribute('data-sys');
  document.getElementById('pgPortal').classList.add('on');
  document.getElementById('pgSys').classList.remove('on');
  document.getElementById('hBrand').textContent = '行业监控系统';
  document.getElementById('hSub').textContent = '娱乐资本论';
  for (const id of Object.keys(SYS)) {
    D[id].items = lg(sk(id,'items'), []);
    D[id].sources = lg(sk(id,'src'), D[id].sources);
  }
  rPortal();
}

function rPortal() {
  const g = document.getElementById('ptlGrid');
  g.innerHTML = Object.values(SYS).map(s => {
    const d = D[s.id];
    return `<div class="ptl-c" onclick="location.hash='${s.id}'" style="--accent:${s.accent}">
      <div class="ptl-i">${s.icon}</div>
      <div class="ptl-t">${s.name}</div>
      <div class="ptl-d">${s.desc}</div>
      <div style="margin-top:var(--space-md);display:flex;gap:var(--space-md)">
        <span class="bdg bdg-l">${d.sources.filter(x=>x.enabled).length} 信息源</span>
        <span class="bdg bdg-m">${d.items.length} 监控项</span>
      </div>
    </div>`;
  }).join('');
}

// === ENTER SYSTEM ===
function enterSys(id) {
  curSys = id;
  const sys = SYS[id], d = D[id];
  d.items = lg(sk(id,'items'), d.items);
  d.sources = lg(sk(id,'src'), d.sources);
  d.keywords = lg(sk(id,'kw'), d.keywords);
  d.alertKw = lg(sk(id,'akw'), d.alertKw);
  d.aiPrompt = lg(sk(id,'aiprompt'), d.aiPrompt);
  d.cfg = Object.assign({interval:30,auto:true,notif:true,maxItems:500,blacklist:'',whitelist:'',notifFreq:'realtime',reportTime:'18:00'}, lg(sk(id,'cfg'), {}));

  document.documentElement.setAttribute('data-sys', id);
  document.getElementById('pgPortal').classList.remove('on');
  document.getElementById('pgSys').classList.add('on');
  document.getElementById('hBrand').textContent = sys.icon + ' ' + sys.name;
  document.getElementById('hSub').textContent = '行业监控系统';
  document.querySelectorAll('#sysTabs .tab').forEach((t,i) => t.classList.toggle('on', i===0));
  document.querySelectorAll('.tp').forEach((p,i) => p.style.display = i===0?'block':'none');
  rDash(); rSrc(); rTl(); rKw(); rRp(); rCharts();
  clearInterval(rTimer);
  if (d.cfg.auto) rTimer = setInterval(() => refreshData(), d.cfg.interval * 60000);
}

function goPortal() { location.hash = ''; }

// === TABS ===
function swTab(btn) {
  const t = btn.dataset.tab;
  document.querySelectorAll('#sysTabs .tab').forEach(x => x.classList.remove('on'));
  btn.classList.add('on');
  const map = {dashboard:'pDash',sources:'pSrc',timeline:'pTl',keywords:'pKw',reports:'pRp'};
  Object.values(map).forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById(map[t]).style.display = 'block';
  if (t === 'dashboard') rCharts();
}

  const cur = document.documentElement.getAttribute('data-theme');

function toast(msg, cls='') {
  const c = document.getElementById('tc');
  const el = document.createElement('div');
  el.className = 'tst ' + cls;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }, 4000);
}

// === LOADING BAR ===
function ldBar(pct) {
  const bar = document.getElementById('ldBar');
  if (pct <= 0) { bar.classList.remove('on'); bar.style.width = '0'; return; }
  bar.classList.add('on');
  bar.style.width = pct + '%';
  if (pct >= 100) setTimeout(() => ldBar(0), 500);
}

// === FETCH WITH PROXY ===
async function fetchProxy(url) {
  let lastErr = null;
  for (const proxy of PROXIES) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 15000);
      const resp = await fetch(proxy + encodeURIComponent(url) + '&_t=' + Date.now(), {signal: ctrl.signal});
      clearTimeout(tid);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const buf = await resp.arrayBuffer();
      return new TextDecoder('utf-8').decode(buf);
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

// === PARSE RSS from XML ===
function parseRSS(xml, src) {
  try {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) return [];
    const items = doc.querySelectorAll('item, entry');
    const out = [];
    items.forEach(el => {
      let title = el.querySelector('title')?.textContent?.trim();
      let link = el.querySelector('link')?.textContent?.trim();
      if (!link) { const le = el.querySelector('link[href]'); if (le) link = le.getAttribute('href'); }
      let pubDate = el.querySelector('pubDate, published, updated')?.textContent?.trim();
      if (!title || !link) return;
      let source = src.name;
      if (title.includes(' - ') && title.split(' - ').pop().length < 20) {
        source = title.split(' - ').pop();
        title = title.split(' - ').slice(0, -1).join(' - ');
      }
      let ts = Date.now();
      if (pubDate) { const p = new Date(pubDate).getTime(); if (!isNaN(p)) ts = p; }
      out.push({id: link+'_'+ts, title, url: link, source, srcId: src.id, ts, type: src.type, cat: src.category||'默认', read:false, important:false});
    });
    return out.slice(0, 10);
  } catch(e) { return []; }
}

// === PARSE RSS from rss2json API response ===
function parseRSS2JSON(data, src) {
  try {
    if (!data.items || !Array.isArray(data.items)) return [];
    return data.items.map(item => {
      let title = item.title || '';
      let link = item.link || '';
      let source = src.name;
      if (title.includes(' - ') && title.split(' - ').pop().length < 20) {
        source = title.split(' - ').pop();
        title = title.split(' - ').slice(0, -1).join(' - ');
      }
      let ts = item.pubDate ? new Date(item.pubDate).getTime() : Date.now();
      if (isNaN(ts)) ts = Date.now();
      return {id: link+'_'+ts, title, url: link, source, srcId: src.id, ts, type: src.type, cat: src.category||'默认', read:false, important:false};
    }).slice(0, 10);
  } catch(e) { return []; }
}

// === PARSE PAGE ===
function parsePage(html, src, snapshot) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const body = doc.body; if (!body) return [];
    body.querySelectorAll('script,style,nav,footer,header').forEach(s => s.remove());
    const text = body.innerText || '';
    const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>10);
    if (!snapshot) {
      // First visit: return all meaningful lines as items
      return lines.slice(0, 15).map((line, i) => ({
        id: src.id+'_init_'+Date.now()+'_'+i, title: line.substring(0,120), url: src.url,
        source: src.name, srcId: src.id, ts: Date.now(), type:'page',
        cat: src.category||'默认', read:false, important:false
      }));
    }
    const oldSet = new Set(snapshot.split('\n').map(l=>l.trim()).filter(l=>l.length>10));
    return lines.filter(l=>!oldSet.has(l)).slice(0,20).map((line,i) => ({
      id: src.id+'_'+Date.now()+'_'+i, title: line.substring(0,120), url: src.url,
      source: src.name, srcId: src.id, ts: Date.now(), type:'page',
      cat: src.category||'默认', read:false, important:false
    }));
  } catch(e) { return []; }
}

// === REFRESH ===
async function refreshData() {
  if (!curSys) return;
  const d = D[curSys];
  if (d.loading) return;
  d.loading = true;
  ldBar(10);
  const btn = document.getElementById('rfBtn');
  btn.style.opacity = '0.5';

  const enabled = d.sources.filter(s => s.enabled);
  let newItems = [], ok = 0, fail = 0;
  const total = enabled.length;

  for (let i = 0; i < total; i++) {
    const src = enabled[i];
    ldBar(10 + 80 * (i / total));
    try {
      let items = [];
      let actualUrl = src.url;

      // Google News type: build RSS URL from keywords
      if (src.type === 'gnews') {
        actualUrl = buildGNewsRSS(src.url);
        src._resolvedUrl = actualUrl;
      } else {
        src._resolvedUrl = src.url;
      }

      if (src.type === 'rss' || src.type === 'gnews') {
        // Try rss2json first
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 15000);
          const resp = await fetch(RSS2JSON + encodeURIComponent(actualUrl), {signal: ctrl.signal});
          clearTimeout(tid);
          if (resp.ok) {
            const data = await resp.json();
            if (data.status === 'ok' && data.items?.length) {
              items = parseRSS2JSON(data, src);
            }
          }
        } catch(e) {}
        // Fallback to direct proxy
        if (!items.length) {
          try {
            const xml = await fetchProxy(actualUrl);
            items = parseRSS(xml, src);
          } catch(e) {}
        }
        if (items.length) { ok++; } else { fail++; }
      } else {
        // Page type - fetch and diff
        try {
          const html = await fetchProxy(src.url);
          const oldSnap = d.snaps[src.id] || null;
          items = parsePage(html, src, oldSnap);
          d.snaps[src.id] = html;
          ls(sk(curSys,'snap'), d.snaps);
          ok++;
        } catch(e) { fail++; }
      }
      newItems.push(...items);
    } catch(e) {
      console.warn('Fetch fail:', src.name, e.message);
      fail++;
    }
  }

  ldBar(95);

  // Dedup
  const seen = new Set();
  const deduped = newItems.filter(i => {
    const key = i.url + '|' + i.title;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  const existIds = new Set(d.items.map(i => i.url + '|' + i.title));
  const unique = deduped.filter(i => !existIds.has(i.url + '|' + i.title));

  // AI dedup if configured
  let finalItems = unique;
  const aiCfg = lg('mon_ai_cfg', {});
  if (aiCfg.key && aiCfg.dedupPrompt !== undefined && unique.length > 1) {
    try {
      const titles = unique.map(i => i.title).join('\n');
      const dedupPrompt = (aiCfg.dedupPrompt || '以下新闻标题中，识别并去除重复或高度相似的条目，返回去重后的标题列表，每行一个：\n') + titles;
      const aiResult = await callAI(dedupPrompt);
      if (aiResult && aiResult !== '无摘要') {
        const keptTitles = aiResult.split('\n').map(t=>t.replace(/^[\s\-•*\d.]+/,'').trim()).filter(t=>t.length>3);
        if (keptTitles.length > 0 && keptTitles.length < unique.length) {
          const keptSet = new Set(keptTitles.map(t=>t.toLowerCase()));
          finalItems = unique.filter(i => keptSet.has(i.title.toLowerCase()) || keptTitles.some(kt => i.title.toLowerCase().includes(kt.toLowerCase())));
          if (finalItems.length === 0) finalItems = unique; // safety fallback
        }
      }
    } catch(e) { /* fallback to no AI dedup */ }
  }

  // Keyword match
  const allKw = [...d.keywords, ...d.alertKw];
  finalItems.forEach(item => {
    const txt = (item.title||'').toLowerCase();
    allKw.forEach(kw => { if (txt.includes(kw.toLowerCase())) item.important = true; });
  });

  // Merge & trim
  d.items = [...finalItems, ...d.items].slice(0, d.cfg.maxItems);
  ls(sk(curSys,'items'), d.items);

  // Notify
  if (d.cfg.notif && finalItems.length > 0) {
    const alerts = finalItems.filter(i => {
      const txt = (i.title||'').toLowerCase();
      return d.alertKw.some(k => txt.includes(k.toLowerCase()));
    });
    if (alerts.length > 0 && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(SYS[curSys].name + ' - 告警', {body: `发现${alerts.length}条告警：${alerts[0].title.substring(0,50)}`}); } catch(e) {}
    }
  }

  d.loading = false;
  btn.style.opacity = '1';
  ldBar(100);

  if (finalItems.length > 0) toast(`新增 ${finalItems.length} 条 (成功 ${ok}/${total})`, 'ok');
  else toast(`已刷新 (成功 ${ok}/${total})`, ok > 0 ? 'ok' : 'err');

  rDash(); rTl(); rCharts();
}

// Pie Chart
function rPieChart(d) {
  const cats = {};
  d.items.forEach(i => { const c = i.cat||'默认'; cats[c] = (cats[c]||0) + 1; });
  const entries = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  if (!entries.length) {
    document.getElementById('dsPie').innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px">暂无数据</div>';
    return;
  }
  const total = entries.reduce((s,e) => s+e[1], 0);
  const colors = ['#E91E8C','#1565C0','#D97706','#7C3AED','#0D9488','#E53E3E','#38A169','#DD6B20','#3182CE','#805AD5'];
  let paths = '', legend = '', angle = 0;
  entries.forEach(([cat, count], i) => {
    const pct = count / total;
    const startAngle = angle;
    const endAngle = angle + pct * 360;
    const startRad = startAngle * Math.PI / 180;
    const endRad = endAngle * Math.PI / 180;
    const x1 = 100 + 80 * Math.cos(startRad - Math.PI/2);
    const y1 = 100 + 80 * Math.sin(startRad - Math.PI/2);
    const x2 = 100 + 80 * Math.cos(endRad - Math.PI/2);
    const y2 = 100 + 80 * Math.sin(endRad - Math.PI/2);
    const largeArc = pct > 0.5 ? 1 : 0;
    paths += `<path d="M100,100 L${x1},${y1} A80,80 0 ${largeArc},1 ${x2},${y2} Z" fill="${colors[i%colors.length]}" opacity="0.8">
      <title>${esc(cat)}: ${count}条 (${(pct*100).toFixed(1)}%)</title></path>`;
    legend += `<div style="display:flex;align-items:center;gap:4px;margin:2px 0"><span style="width:10px;height:10px;border-radius:2px;background:${colors[i%colors.length]};flex-shrink:0"></span><span style="font-size:11px;color:var(--text-secondary)">${esc(cat)} ${count}</span></div>`;
    angle = endAngle;
  });
  document.getElementById('dsPie').innerHTML = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${paths}<circle cx="100" cy="100" r="35" fill="var(--bg-card)"/><text x="100" y="96" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="900">${total}</text><text x="100" y="112" text-anchor="middle" fill="var(--text-muted)" font-size="9">总计</text></svg><div style="position:absolute;right:8px;top:8px">${legend}</div>`;
}

// Bar Chart
function rBarChart(d) {
  const srcCount = {};
  d.items.forEach(i => { srcCount[i.source] = (srcCount[i.source]||0) + 1; });
  const entries = Object.entries(srcCount).sort((a,b) => b[1]-a[1]).slice(0,8);
  if (!entries.length) {
    document.getElementById('dsBar').innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px">暂无数据</div>';
    return;
  }
  const max = Math.max(...entries.map(e=>e[1]));
  const barW = 30, gap = 8, chartH = 140, baseY = 160, startX = 60;
  let bars = '', labels = '';
  entries.forEach(([name, count], i) => {
    const x = startX + i * (barW + gap);
    const h = max > 0 ? (count / max) * chartH : 0;
    bars += `<rect x="${x}" y="${baseY - h}" width="${barW}" height="${h}" rx="3" fill="var(--accent)" opacity="0.8">
      <title>${esc(name)}: ${count}条</title></rect>`;
    bars += `<text x="${x + barW/2}" y="${baseY - h - 4}" text-anchor="middle" fill="var(--text)" font-size="9" font-weight="700">${count}</text>`;
    labels += `<text x="${x + barW/2}" y="${baseY + 14}" text-anchor="middle" fill="var(--text-muted)" font-size="8" transform="rotate(-30,${x+barW/2},${baseY+14})">${esc(name.length>6?name.slice(0,6)+'…':name)}</text>`;
  });
  document.getElementById('dsBar').innerHTML = `<svg viewBox="0 0 ${startX + entries.length*(barW+gap) + 20} 190" xmlns="http://www.w3.org/2000/svg">
    <line x1="${startX-5}" y1="${baseY}" x2="${startX + entries.length*(barW+gap)+10}" y2="${baseY}" stroke="var(--border)" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

// Line Chart
function rLineChart(d) {
  // Group items by day for last 7 days
  const days = [];
  const now = new Date();
  for (let i = 6; i >= 0; i--) {
    const day = new Date(now);
    day.setDate(day.getDate() - i);
    day.setHours(0,0,0,0);
    const nextDay = new Date(day);
    nextDay.setDate(nextDay.getDate() + 1);
    const count = d.items.filter(it => it.ts >= day.getTime() && it.ts < nextDay.getTime()).length;
    days.push({label: `${day.getMonth()+1}/${day.getDate()}`, count});
  }
  const max = Math.max(...days.map(d=>d.count), 1);
  const chartW = 350, chartH = 120, padX = 50, padY = 20, baseY = chartH + padY;
  const step = chartW / (days.length - 1 || 1);
  let points = '', gridLines = '', xLabels = '';
  days.forEach((day, i) => {
    const x = padX + i * step;
    const y = baseY - (day.count / max) * chartH;
    points += (i === 0 ? 'M' : 'L') + `${x},${y}`;
    gridLines += `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"><title>${day.label}: ${day.count}条</title></circle>`;
    gridLines += `<text x="${x}" y="${baseY + 16}" text-anchor="middle" fill="var(--text-muted)" font-size="9">${day.label}</text>`;
  });
  document.getElementById('dsLine').innerHTML = `<svg viewBox="0 0 ${chartW+padX+20} ${chartH+padY+30}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padX}" y1="${baseY}" x2="${padX+chartW+10}" y2="${baseY}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${padX}" y1="${padY}" x2="${padX}" y2="${baseY}" stroke="var(--border)" stroke-width="1"/>
    <path d="${points}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${points} L${padX+(days.length-1)*step},${baseY} L${padX},${baseY} Z" fill="var(--accent)" opacity="0.1"/>
    ${gridLines}
  </svg>`;
}

function rRp() { if (!curSys) return; document.getElementById('rpD').value = new Date().toISOString().split('T')[0]; }

async function genRpt(type) {
  if (!curSys) return;
  const d = D[curSys], sys = SYS[curSys];
  const date = document.getElementById('rpD').value;
  const useAI = document.getElementById('rpAI').checked;
  const customPrompt = document.getElementById('rpPrompt').value.trim();
  // Save prompt
  d.aiPrompt = customPrompt;
  ls(sk(curSys,'aiprompt'), d.aiPrompt);

  const start = new Date(date);
  const end = new Date(date);
  if (type === 'weekly') start.setDate(start.getDate() - 7);
  const items = d.items.filter(i => i.ts >= start.getTime() && i.ts <= end.getTime() + 86400000);
  let rpt = '';
  const label = type==='daily' ? date : `${start.toISOString().split('T')[0]} ~ ${date}`;
  rpt += `${sys.name} - ${type==='daily'?'日报':'周报'}\n`;
  rpt += `报告日期：${label}\n生成时间：${new Date().toLocaleString('zh-CN')}\n${'='.repeat(40)}\n\n`;
  if (!items.length) {
    rpt += '本期无监控数据。\n';
  } else {
    rpt += `本期共采集 ${items.length} 条，其中重要/告警 ${items.filter(i=>i.important).length} 条。\n\n`;
    const groups = {};
    items.forEach(i => { const c = i.cat||'默认'; if(!groups[c]) groups[c]=[]; groups[c].push(i); });
    for (const [cat, ci] of Object.entries(groups)) {
      rpt += `【${cat}】(${ci.length}条)\n`;
      ci.slice(0,30).forEach(i => {
        rpt += `  ${i.important?'[!]':' · '} [${new Date(i.ts).toLocaleString('zh-CN')}] ${i.source}: ${i.title}\n`;
        if (i.url) rpt += `    ${i.url}\n`;
      });
      if (ci.length > 30) rpt += `  ...及其他 ${ci.length-30} 条\n`;
      rpt += '\n';
    }
    if (useAI && items.length > 0) {
      rpt += `${'='.repeat(40)}\nAI 摘要\n${'─'.repeat(30)}\n`;
      try {
        const txt = items.slice(0,30).map(i => `[${i.source}] ${i.title}`).join('\n');
        let prompt = customPrompt || sys.defaultAIPrompt || '你是{sys}的数据分析师。请根据以下监控数据，生成{type}摘要。简明扼要，中文。\n';
        prompt = prompt.replace(/\{sys\}/g, sys.name).replace(/\{type\}/g, type==='daily'?'日报':'周报');
        prompt += '\n\n' + txt;
        rpt += await callAI(prompt) + '\n';
      } catch(e) { rpt += `AI摘要失败：${e.message}\n`; }
    }
  }
  document.getElementById('rpV').textContent = rpt;
  toast('报告已生成','ok');
}

// === AI CALL (unified, supports multiple providers) ===
async function callAI(prompt) {
  const aiCfg = lg('mon_ai_cfg', {});
  const provider = aiCfg.provider || 'zhipu';
  const preset = AI_PROVIDERS[provider] || AI_PROVIDERS.zhipu;
  const url = aiCfg.url || preset.url;
  const model = aiCfg.model || preset.model;
  const key = aiCfg.key;

  if (!key) throw new Error('未配置API Key，请在设置中配置');
  if (!url) throw new Error('未配置API地址');

  const r = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model, messages:[{role:'user',content:prompt}], temperature:0.7, max_tokens:1000})
  });
  if (!r.ok) {
    const errText = await r.text().catch(()=>'');
    throw new Error('API ' + r.status + (errText ? ': ' + errText.substring(0,100) : ''));
  }
  const data = await r.json();
  return data.choices?.[0]?.message?.content || '无摘要';
}

  const json = JSON.stringify({version:V, system:curSys, sources:d.sources, keywords:d.keywords, alertKw:d.alertKw, aiPrompt:d.aiPrompt, settings:d.cfg, aiConfig:{provider:aiCfg.provider,url:aiCfg.url,model:aiCfg.model,summarizePrompt:aiCfg.summarizePrompt,dedupPrompt:aiCfg.dedupPrompt}}, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download = `monitor_${curSys}_config.json`; a.click();
  toast('设置已导出','ok');
}

function impAll() {
  if (!curSys) return;
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        const d = D[curSys];
        if (data.sources) { d.sources = data.sources; ls(sk(curSys,'src'),d.sources); }
        if (data.keywords) { d.keywords = data.keywords; ls(sk(curSys,'kw'),d.keywords); }
        if (data.alertKw) { d.alertKw = data.alertKw; ls(sk(curSys,'akw'),d.alertKw); }
        if (data.aiPrompt) { d.aiPrompt = data.aiPrompt; ls(sk(curSys,'aiprompt'),d.aiPrompt); }
        if (data.settings) { d.cfg = Object.assign(d.cfg, data.settings); ls(sk(curSys,'cfg'),d.cfg); }
        if (data.aiConfig) {
          const aiCfg = lg('mon_ai_cfg', {});
          Object.assign(aiCfg, data.aiConfig);
          ls('mon_ai_cfg', aiCfg);
        }
        rStg(); rSrc(); rKw(); rDash(); toast('设置已导入','ok');
      } catch(e) { toast('导入失败','err'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

function clrData() {
  if (!curSys) return;
  const d = D[curSys]; d.items = []; d.snaps = {};
  ls(sk(curSys,'items'),[]); ls(sk(curSys,'snap'),{});
  rDash(); rTl(); rStg(); toast('数据已清空');
}

// === HELPERS ===
function fmtTime(ts) {
  if (!ts) return '--:--';
  return new Date(ts).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hlKw(text) {
  if (!curSys) return text;
  const d = D[curSys];
  const allKw = [...d.keywords, ...d.alertKw].sort((a,b) => b.length - a.length);
  let r = text;
  allKw.forEach(kw => {
    const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    r = r.replace(re, m => `<span class="kw-h">${m}</span>`);
  });
  return r;
}

// === START ===
init();
</script>
